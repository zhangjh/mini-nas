version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile.server
    container_name: mini-nas-server
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      # 模型只读挂载，不进镜像（两份 ONNX 合计 718MB）。
      - ./server/models:/data/models:ro
      - /:/host
    environment:
      - TZ=Asia/Shanghai
      - HOST_ROOT=/host
      # onnxruntime + OpenVINO EP 运行库，由镜像构建阶段从 wheel 抽取。
      - LD_LIBRARY_PATH=/opt/ort
    # iGPU 直通：没有这两个配置，OpenVINO 只能跑 CPU（索引慢约 6 倍）。
    devices:
      - /dev/dri:/dev/dri
    # /dev/dri/renderD128 属主是 root:render(660)，容器内进程必须带上这个 GID。
    # 只能传数字：镜像里没有 render 组（Debian 默认不建），写组名会让容器
    # 直接起不来（"Unable to find group render"）。
    # 取值用 stat -c %g /dev/dri/renderD128 查，本机是 110。
    group_add:
      - "${RENDER_GID:-110}"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: mini-nas-web
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
